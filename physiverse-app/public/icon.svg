<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="physiverse-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded Badge matching Navbar logo container -->
  <rect x="0" y="0" width="32" height="32" rx="7.5" fill="url(#physiverse-bg-grad)" />

  <!-- Logo Atom Vector matching LogoIcon.tsx -->
  <g transform="translate(16, 16) scale(0.95)">
    <!-- Central Nucleus -->
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />

    <!-- Orbit 1 (0 deg) -->
    <g transform="rotate(0)">
      <ellipse cx="0" cy="0" rx="4.2" ry="11.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <!-- Orbit 2 (60 deg) -->
    <g transform="rotate(60)">
      <ellipse cx="0" cy="0" rx="4.2" ry="11.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <!-- Orbit 3 (120 deg) -->
    <g transform="rotate(120)">
      <ellipse cx="0" cy="0" rx="4.2" ry="11.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    </g>
  </g>
</svg>
